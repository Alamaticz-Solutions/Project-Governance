[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API calls to the Rust/Axum backend on Render (same-origin from the
# browser's perspective, so no CORS config is needed on the backend).
[[redirects]]
  from = "/api/*"
  to = "https://pdsgovernance.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback so client-side routes (React Router) don't 404 on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
