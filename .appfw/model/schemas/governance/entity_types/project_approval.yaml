# Legacy table: project_approvals (REST-wired via /projects/*, submit-decision, approvals/pending).
# assigned_role -> UserRole (Set A / spec 001; referenced here only).
# assigned_user_id and approved_by both FK -> User.
# status / decision are plain string vocabularies (status: Pending / Approved / Rejected / Returned).
# Legacy struct: status, sequence_order, notification_sent, created_at are all non-null -> required here.
- name: ProjectApproval
  id: 7b1e4a20-000a-4a10-9c0a-a0b1c2d3e4f9
  is_table: true
  facets: [audited, concurrency]
  props:

  - name: id
    fragment: property-primary-key-uuid

  - name: project_id
    caption: Project
    data_type: Uuid
    is_required: true
    foreign_key:
      type_name: Project

  - name: approval_stage
    caption: Approval Stage
    fragment: property-string-caption

  - name: assigned_role
    fragment: property-enum-required
    enum_type_name: UserRole

  - name: assigned_user_id
    caption: Assigned User
    data_type: Uuid
    foreign_key:
      type_name: User

  - name: status
    fragment: property-string
    is_required: true
    default_value: "Pending"

  - name: decision
    fragment: property-string

  - name: comments
    fragment: property-string-stringmax-lg

  - name: approved_by
    caption: Approved By
    data_type: Uuid
    foreign_key:
      type_name: User

  - name: approved_at
    fragment: property-date-time

  - name: sequence_order
    fragment: property-int-md
    is_required: true
    default_value: 0

  - name: notification_sent
    fragment: property-boolean-toggle
    is_required: true
    default_value: false

  - name: created_at
    fragment: property-date-time-required

  - name: updated_at
    fragment: property-date-time
