# Workflow / gate / approvals relationships (Set B).
# One OneToMany per physical FK column owned by a Set B entity.
# NavToOne/NavToMany fields are PROJECTED from these — never hand-authored on the entities (ADR 0003).
# Project and User are Set A entities; `missing_relationship_endpoint_entity` will fire for the
# Project-/User-side endpoints until Set A's entity files land. This is expected, not a defect here.

- name: workflow_definition_stages
  kind: OneToMany
  one:
    entity: WorkflowDefinition
    field: stage_definitions
  many:
    entity: WorkflowStageDefinition
    field: workflow_definition
  storage:
    type: ForeignKey
    owner: WorkflowStageDefinition
    field: workflow_id

- name: workflow_definition_instances
  kind: OneToMany
  one:
    entity: WorkflowDefinition
    field: instances
  many:
    entity: WorkflowInstance
    field: definition
  storage:
    type: ForeignKey
    owner: WorkflowInstance
    field: definition_id

- name: project_workflow_instances
  kind: OneToMany
  one:
    entity: Project
    field: workflow_instances
  many:
    entity: WorkflowInstance
    field: project
  storage:
    type: ForeignKey
    owner: WorkflowInstance
    field: project_id

- name: workflow_instance_stages
  kind: OneToMany
  one:
    entity: WorkflowInstance
    field: stages
  many:
    entity: WorkflowStage
    field: workflow_instance
  storage:
    type: ForeignKey
    owner: WorkflowStage
    field: workflow_instance_id

- name: stage_definition_stages
  kind: OneToMany
  one:
    entity: WorkflowStageDefinition
    field: stages
  many:
    entity: WorkflowStage
    field: stage_definition
  storage:
    type: ForeignKey
    owner: WorkflowStage
    field: stage_definition_id

- name: workflow_stage_tasks
  kind: OneToMany
  one:
    entity: WorkflowStage
    field: tasks
  many:
    entity: WorkflowTask
    field: stage
  storage:
    type: ForeignKey
    owner: WorkflowTask
    field: stage_id

- name: workflow_task_assignments
  kind: OneToMany
  one:
    entity: WorkflowTask
    field: assignments
  many:
    entity: TaskAssignment
    field: task
  storage:
    type: ForeignKey
    owner: TaskAssignment
    field: task_id

- name: user_task_assignments
  kind: OneToMany
  one:
    entity: User
    field: task_assignments
  many:
    entity: TaskAssignment
    field: assignee
  storage:
    type: ForeignKey
    owner: TaskAssignment
    field: assignee_id

- name: user_task_assignments_made
  kind: OneToMany
  one:
    entity: User
    field: task_assignments_made
  many:
    entity: TaskAssignment
    field: assigned_by
  storage:
    type: ForeignKey
    owner: TaskAssignment
    field: assigned_by_id

- name: workflow_task_checklist_items
  kind: OneToMany
  one:
    entity: WorkflowTask
    field: checklist_items
  many:
    entity: ChecklistItem
    field: task
  storage:
    type: ForeignKey
    owner: ChecklistItem
    field: task_id

- name: user_checklist_completions
  kind: OneToMany
  one:
    entity: User
    field: checklist_completions
  many:
    entity: ChecklistItem
    field: completed_by
  storage:
    type: ForeignKey
    owner: ChecklistItem
    field: completed_by_id

- name: project_gate_reviews
  kind: OneToMany
  one:
    entity: Project
    field: gate_reviews
  many:
    entity: GateReview
    field: project
  storage:
    type: ForeignKey
    owner: GateReview
    field: project_id

- name: user_gate_decisions
  kind: OneToMany
  one:
    entity: User
    field: decided_gate_reviews
  many:
    entity: GateReview
    field: decided_by
  storage:
    type: ForeignKey
    owner: GateReview
    field: decision_by_id

- name: project_gate_submissions
  kind: OneToMany
  one:
    entity: Project
    field: gate_submissions
  many:
    entity: GateSubmission
    field: project
  storage:
    type: ForeignKey
    owner: GateSubmission
    field: project_id

# many.field is `submitter` (not `submitted_by`) to avoid colliding with the native
# `submitted_by` scalar FK property on GateSubmission (relationship_field_conflicts_with_native_property).
- name: user_gate_submissions
  kind: OneToMany
  one:
    entity: User
    field: gate_submissions
  many:
    entity: GateSubmission
    field: submitter
  storage:
    type: ForeignKey
    owner: GateSubmission
    field: submitted_by

- name: project_approvals
  kind: OneToMany
  one:
    entity: Project
    field: approvals
  many:
    entity: ProjectApproval
    field: project
  storage:
    type: ForeignKey
    owner: ProjectApproval
    field: project_id

- name: user_assigned_approvals
  kind: OneToMany
  one:
    entity: User
    field: assigned_approvals
  many:
    entity: ProjectApproval
    field: assigned_user
  storage:
    type: ForeignKey
    owner: ProjectApproval
    field: assigned_user_id

# many.field is `approver` (not `approved_by`) to avoid colliding with the native
# `approved_by` scalar FK property on ProjectApproval.
- name: user_approved_approvals
  kind: OneToMany
  one:
    entity: User
    field: approved_approvals
  many:
    entity: ProjectApproval
    field: approver
  storage:
    type: ForeignKey
    owner: ProjectApproval
    field: approved_by
