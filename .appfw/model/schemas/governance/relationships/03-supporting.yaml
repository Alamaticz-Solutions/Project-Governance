# SET C — supporting-entity relationships. All OneToMany.
# Directional nav fields (one.field / many.field) are projected onto the participating
# entities by app_gen (ADR 0003) — never hand-authored as NavTo* props.
# Endpoint field names checked against legacy entity structs for
# relationship_field_conflicts_with_native_property — no collisions.

- name: project_risks
  kind: OneToMany
  one:
    entity: Project
    field: risks
  many:
    entity: RiskItem
    field: project
  storage:
    type: ForeignKey
    owner: RiskItem
    field: project_id

- name: user_owned_risks
  kind: OneToMany
  one:
    entity: User
    field: owned_risks
  many:
    entity: RiskItem
    field: owner
  storage:
    type: ForeignKey
    owner: RiskItem
    field: owner_id

- name: project_attachments
  kind: OneToMany
  one:
    entity: Project
    field: attachments
  many:
    entity: Attachment
    field: project
  storage:
    type: ForeignKey
    owner: Attachment
    field: project_id

- name: user_uploaded_attachments
  kind: OneToMany
  one:
    entity: User
    field: uploaded_attachments
  many:
    entity: Attachment
    field: uploaded_by
  storage:
    type: ForeignKey
    owner: Attachment
    field: uploaded_by_id

