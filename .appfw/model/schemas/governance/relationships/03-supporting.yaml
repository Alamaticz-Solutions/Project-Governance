# MUST NOT cascade-delete — see 000-INDEX findings (legacy ON DELETE CASCADE on
# audit_history.project_id would destroy the audit trail on project delete).
# The grammar has no cascade knob in `storage`; this comment is the control.
- name: project_audit_events
  kind: OneToMany
  one:
    entity: Project
    field: audit_events
  many:
    entity: AuditEvent
    field: project
  storage:
    type: ForeignKey
    owner: AuditEvent
    field: project_id

- name: user_audit_events
  kind: OneToMany
  one:
    entity: User
    field: audit_events
  many:
    entity: AuditEvent
    field: performed_by
  storage:
    type: ForeignKey
    owner: AuditEvent
    field: performed_by_id

- name: user_notifications
