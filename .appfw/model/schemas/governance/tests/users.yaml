# Generated API scenario for User — find a seeded demo user (seeds/01_users.yaml).
# GraphQL enum values on the wire are PascalCase (backend enums carry
# `#[graphql(rename_items = "PascalCase")]`), so `role` is `Admin`, not the
# model's SCREAMING_SNAKE `ADMIN`. The frontend uses the same PascalCase.
- name: find_seeded_admin_user
  description: the seeded admin demo user is retrievable
  auth_token: pdsh_admin
  graphql:
    schema: governance
    type: query
    name: findUser
    variables:
    - name: id
      type: String!
      yaml_value: 'b0000000-0000-4000-8000-000000000001'
    select: 'id,email,username,role,is_active'
  expect:
    data:
      email: admin@abchealth.com
      username: admin
      role: Admin
      is_active: true
