migration_and_parallel_run:
  migration_plan: >-
    Fresh generated schema from .appfw/model; no data migration in scope for local/dev. The current app uses
    a Postgres DB named governance (dev: governance_db); legacy objects live in the `public` schema, so a new
    `governance` schema would not collide at the object level — but the migration-history table and the enum
    type names (userrole, projectstatus, ...) WOULD collide in `public`. The rebuild must therefore use a
    separate database (or at minimum a dedicated schema plus a distinct migrations table and enum namespace)
    to avoid collision. Local-disk attachments under static/uploads/ on the current Render deploy are already
    non-durable and are not a migration source.
  reconciliation_checks:
    - 'Deferred — applies at Stage, not now. When run: row-count and key-field parity per entity vs a frozen legacy snapshot; verify the enum-casing reconciliation (workflow_stage_status vs WorkflowStageStatus) resolves to one label set.'
  rollback_checks:
    - 'Deferred — applies at Stage, not now. Greenfield rebuild in a separate repo/branch; rollback = keep running the current app.'
  live_api_tests:
    - 'Deferred — applies at Stage, not now. When run: parity tests for the wired REST surface enumerated in static_analysis (auth, projects CRUD + submit-decision, workspace save/advance, gate-review decision, dashboard, notifications, audit, teams-poc transcript ingest read path).'
hardening:
