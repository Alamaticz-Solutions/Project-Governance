version: '3.8'

# Product-intake local development topology.
# Generated from .appfw/manifest.yaml and .appfw/model/data_sources/_res.yaml.
# Edit product topology/config, then rerun generation after the entity model exists.
services:
  postgres:
    image: postgres:14
    container_name: ${APP_STACK_NAME:-governance}-postgres
    restart: always
    ports:
      - "${APP_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: governance
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    image: rust:latest
    container_name: ${APP_STACK_NAME:-governance}-backend
    working_dir: /app
    volumes:
      - type: bind
        source: ./backend
        target: /app
    ports:
      - "127.0.0.1:${API_PORT:-8080}:${API_PORT:-8080}"
    command: cargo run --bin backend
    depends_on:
      - postgres
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8080}
      - ENV_NAME=${ENV_NAME:-compose}
      - APP_DATA_SOURCE_NAME=pg_primary
      - APP_MCP_ENABLED=false
      - APP_KAFKA_ENABLED=false
    networks:
      - app-network


volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge
