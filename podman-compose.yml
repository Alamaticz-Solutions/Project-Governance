# Local development stack for the self-owned governance backend.
#
# HISTORY: this file was originally generated by `scripts/appfw generate`
# from the old App Framework. That framework was removed entirely (backend
# framework replacement phase 7 final cutover, 2026-09-07) and the generated
# file was left stale -- it bind-mounted `../app-framework/appfw_runtime`
# (for the backend) and `../app-framework/observability/*` (for a
# loki/alloy/prometheus/alertmanager/grafana stack), none of which exist
# anymore. It was hand-rewritten during manual bring-up (gap #6):
#   * backend now builds from backend/Dockerfile (multi-stage, no bind mount)
#   * postgres now provisions the schema on first init from the generated
#     database/_pkg SQL (proves gaps #1 + #2 end to end)
#   * the observability profile was DROPPED -- its five services depended on
#     config files that lived in the deleted `../app-framework/observability`
#     tree. Re-add them here (or in a compose override) once product-owned
#     equivalents of those configs exist. The backend still emits
#     OpenTelemetry / structured logs; nothing consumes them in this stack.
#
# Usage:
#   podman compose up -d --build
#   curl -sf http://127.0.0.1:3000/health

services:

  postgres:
    image: postgres:16-alpine
    container_name: ${APP_STACK_NAME:-governance}-postgres
    restart: always
    ports:
      - "${APP_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${PG_SERVICE_ACCOUNT_NAME:-governance_svc}
      POSTGRES_PASSWORD: ${PG_SERVICE_ACCOUNT_PASS:-local-dev-password}
      POSTGRES_DB: governance
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      # Applied in filename order the first time the data directory is
      # empty. tables.pg.sql now self-creates `CREATE SCHEMA IF NOT EXISTS
      # governance;` (product_gen ddl.rs divergence, gap #1); seed.pg.sql
      # renders jsonb list columns as `'[...]'::jsonb` (commit ccaeee4,
      # gap #2). To re-run after a schema change: `podman compose down -v`.
      - type: bind
        source: ./database/_pkg/schemas/governance/tables.pg.sql
        target: /docker-entrypoint-initdb.d/10_tables.sql
        read_only: true
      - type: bind
        source: ./database/_pkg/schemas/governance/seed.pg.sql
        target: /docker-entrypoint-initdb.d/20_seed.sql
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_SERVICE_ACCOUNT_NAME:-governance_svc} -d governance"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    security_opt:
      - label=disable

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${APP_STACK_NAME:-governance}-backend
    container_name: ${APP_STACK_NAME:-governance}-backend
    ports:
      - "127.0.0.1:${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-3000}
      # `compose` selects the matching block in
      # backend/config/generated/data_sources.yaml (db_host: postgres).
      - ENV_NAME=${ENV_NAME:-compose}
      - PG_SERVICE_ACCOUNT_NAME=${PG_SERVICE_ACCOUNT_NAME:-governance_svc}
      - PG_SERVICE_ACCOUNT_PASS=${PG_SERVICE_ACCOUNT_PASS:-local-dev-password}
      - APP_DATA_SOURCE_NAME=${APP_DATA_SOURCE_NAME:-}
      # Local-test-auth (`appfw-local:` bearer tokens instead of real Okta
      # verification). Under ENV_NAME=compose this needs BOTH flags on; it is
      # still refused on a plain workstation. Leave off to require real Okta.
      - APP_ENABLE_LOCAL_TEST_AUTH=${APP_ENABLE_LOCAL_TEST_AUTH:-true}
      - APP_PROVIDER_CERTIFICATION_CI=${APP_PROVIDER_CERTIFICATION_CI:-true}
      # JwtAuthConfig::from_env() requires these unless ENV_NAME=local. With
      # local-test-auth on, verify_bearer is never reached, so dummy values
      # are fine; override for a real IdP.
      - OKTA_ISSUER=${OKTA_ISSUER:-https://example.invalid/oauth2/default}
      - OKTA_CLIENT_ID=${OKTA_CLIENT_ID:-local-dev-client}
      - OKTA_AUDIENCE=${OKTA_AUDIENCE:-api://default}
      # Worker-thread stack (MiB). Default 128 works around the deep
      # recursion in the ported read path (gap #3, backend/src/main.rs).
      - BACKEND_WORKER_STACK_MIB=${BACKEND_WORKER_STACK_MIB:-128}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - RUST_LOG=${RUST_LOG:-backend=info,tower_http=info}
      - APP_LOG_JSON=${APP_LOG_JSON:-true}
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-backend}
    networks:
      - app-network
    security_opt:
      - label=disable

volumes:
  postgres-data:
    driver: local

networks:
  app-network:
    driver: bridge
