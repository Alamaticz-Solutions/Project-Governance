[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "Project Governance product backend"

[features]
# `provider-postgres` gates the runtime registration in backend/src/routes/mod.rs;
# without it the backend cannot connect to its own database. The generated
# product-intake scaffold omitted it (finding K).
default = ["http", "provider-postgres"]
http = [
    "appfw_runtime/http",
    "dep:async-graphql-axum",
    "dep:axum",
    "dep:hyper",
    "dep:http",
    "dep:tower",
    "dep:tower-http",
]
# mcp / kafka / sync are intentionally not enabled: this product runs a single
# HTTP process against one PostgreSQL data source and never a worker.
# `provider-postgres` gates provider route registration in backend/src/routes/mod.rs.
provider-postgres = []
mcp = []

[lints.rust]
# app_gen emits SCREAMING_SNAKE_CASE variants for multiple GraphQL enums in schemas/governance.rs
# (e.g. ApprovalDecision::NEEDS_INFO, NotificationType::{PROJECT_CREATED, TASK_ASSIGNED, TASK_COMPLETED,
# APPROVAL_REQUIRED, STAGE_ADVANCED, COMMENT_ADDED}, RiskPriority::VERY_HIGH, ProjectStatus::{ON_HOLD,
# IN_DELIVERY}, GateState::IN_PROGRESS, ProjectRole::{PROJECT_MANAGER, VENDOR_SCREENING, ANALYSIS_TEAM},
# GateReviewStatus::{IN_PROGRESS, PENDING_APPROVAL, CHANGES_REQUESTED}).
# The framework generator does not emit per-enum #[allow(non_camel_case_types)], so this lint suppression
# is required to keep a 0-warning build.
non_camel_case_types = "allow"

[dependencies]
anyhow = "1.0"
# PDS App Framework runtime, from the pinned sibling checkout ../app-framework
# (see appfw.lock and the repository root README).
appfw_runtime = { package = "appfw-runtime", path = "../../app-framework/appfw_runtime", default-features = false }
appfw-provider-postgres = { package = "appfw-provider-postgres", path = "../../app-framework/appfw_provider_postgres" }
async-graphql = { version = "6", features = ["bson", "chrono", "dynamic-schema"] }
async-graphql-value = "6"
async-graphql-axum = { version = "6", optional = true }
async-trait = "0.1"
axum = { version = "0.6", features = ["macros"], optional = true }
base64 = "0.22"
bson = "2.0"
# AI intake/gate-form document extraction (services::ai_extraction): pure-Rust
# PDF text extraction, no system deps. .txt is decoded directly; .docx is not
# supported yet (documented limitation, see ai_extraction::text_extract).
pdf-extract = "0.7"
bytes = "1.7"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
deadpool = "0.12"
deadpool-postgres = "0.12"
derivative = "2.2"
dotenv = "0.15"
futures = "0.3"
futures-util = "0.3.27"
governor = "0.10"
hmac = "0.12"
hyper = { version = "1.0", optional = true }
http = { version = "=1.1.0", optional = true }
Inflector = "*"
json = "0.12"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4"] }
regorus = "0.2"
regex = "1"
# Outbound HTTP for the governed Microsoft Graph provider (backend/src/services/graph).
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-postgres-rustls = "0.13"
webpki-roots = "1"
okta-jwt-verifier = "0.9.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
slab = "0.4.7"
strfmt = "0.2.2"
thiserror = "2.0.12"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.4", features = ["catch-panic", "cors", "fs", "request-id", "set-header", "timeout", "trace"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# Signs test tokens for backend/tests/jwt_verification_harness.rs and
# platform::auth's own tests; okta-jwt-verifier itself (used to verify, not
# mint, tokens) is a real dependency above since platform::auth uses it.
jsonwebtoken = "9.3.1"
mockito = "1.6"
