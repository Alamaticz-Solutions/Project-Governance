[workspace]
members = [".", "migration"]
resolver = "2"

[package]
name = "governance-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# --- web / runtime ---
axum = { version = "0.7", features = ["multipart", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "fs"] }
hyper = { version = "1", features = ["full"] }

# --- ORM / db ---
sea-orm = { version = "1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json"] }
migration = { path = "migration" }

# --- serde / validation ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.18", features = ["derive"] }

# --- graphql ---
async-graphql = { version = "=7.0.11", features = ["chrono", "uuid"] }
async-graphql-axum = "=7.0.11"

# --- aws s3 ---
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"

# --- auth ---
jsonwebtoken = "9"
argon2 = "0.5"
rand = "0.8"

# --- ids / time ---
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# --- error handling ---
thiserror = "1"
anyhow = "1"

# --- config / env ---
dotenvy = "0.15"

# --- http client (OpenAI extraction, outbound integrations) ---
reqwest = { version = "0.12", features = ["json", "multipart"] }

# --- email ---
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }

# --- document text extraction (intake AI extraction) ---
pdf-extract = "0.7"
docx-rs = "0.4"

# --- observability ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-request-id = "0.3"

[profile.dev.package.sqlx-macros]
opt-level = 3
