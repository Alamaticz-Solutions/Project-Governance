[package]
name = "backend"
version = "0.1.0"
edition = "2021"
description = "Project Governance product backend"

[features]
# `provider-postgres` gates the runtime registration in backend/src/routes/mod.rs;
# without it the backend cannot connect to its own database. The generated
# product-intake scaffold omitted it (finding K).
default = ["http", "provider-postgres"]
http = [
    "appfw_runtime/http",
    "dep:async-graphql-axum",
    "dep:axum",
    "dep:hyper",
    "dep:http",
    "dep:tower",
    "dep:tower-http",
]
mcp = ["appfw_runtime/mcp"]
kafka = ["appfw_runtime/kafka"]
sync = ["appfw_runtime/sync"]
# The Postgres SQL-generation/execution layer (backend/src/data/clients/postgres)
# is product-owned code, not a framework dependency (backend framework
# replacement phase 3 -- docs/architecture/self-owned-backend-plan.md).
# This feature now only gates route registration in backend/src/routes/mod.rs.
provider-postgres = []

[dependencies]
anyhow = "1.0"
appfw_runtime = { package = "appfw-runtime", path = "../../app-framework/appfw_runtime", default-features = false }
async-graphql = { version = "6", features = ["bson", "chrono", "dynamic-schema"] }
async-graphql-value = "6"
async-graphql-axum = { version = "6", optional = true }
async-trait = "0.1"
axum = { version = "0.6", features = ["macros"], optional = true }
bson = "2.0"
bytes = "1.7"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
deadpool = "0.12"
deadpool-postgres = "0.12"
derivative = "2.2"
dotenv = "0.15"
futures = "0.3"
futures-util = "0.3.27"
governor = "0.10"
hyper = { version = "1.0", optional = true }
http = { version = "=1.1.0", optional = true }
Inflector = "*"
json = "0.12"
opentelemetry = { version = "0.32", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", features = ["metrics", "rt-tokio", "trace"] }
postgres-types = { version = "0.2", features = ["derive", "with-chrono-0_4"] }
regorus = "0.2"
regex = "1"
# Product-owned: outbound HTTP for the governed Microsoft Graph provider
# (backend/src/services/graph, spec 003). Version pinned to the one already in
# the workspace lock (pulled transitively via opentelemetry-otlp).
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
# Product-owned: Postgres TLS connector (backend/src/data/clients/postgres/
# connection.rs, backend framework replacement phase 3e). Versions matched to
# what was already resolved transitively via the framework's provider crate.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1"
tokio-postgres-rustls = "0.13"
webpki-roots = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
slab = "0.4.7"
thiserror = "2.0.12"
time = { version = "0.3", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.4", features = ["cors", "fs", "request-id", "trace"], optional = true }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1", "with-chrono-0_4"] }
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }
