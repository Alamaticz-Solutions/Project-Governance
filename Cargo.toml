[workspace]
members = [
    "api_tests",
    "backend",
]
resolver = "2"

# rego_test moved out (see rego_test/Cargo.toml): it now path-depends on
# product_gen, which declares its own [workspace] -- a member manifest
# cannot both join this workspace and be its own workspace root. api_tests
# still path-depends on the (deleted) framework checkout, so this root
# workspace cannot resolve today regardless; rego_test's exclusion doesn't
# change that. Re-add it here once api_tests' framework dependency is gone
# and rego_test folds back in as an ordinary member (dropping its own
# [workspace] marker at the same time).
