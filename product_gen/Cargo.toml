[workspace]

[package]
name = "product_gen"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# preserve_order: this product's checked-in oracle YAML preserves the
# insertion order of nested JSON objects (meta.relationship's fields,
# validator objects like {name, max}); without this feature serde_json's
# Value::Object is a BTreeMap and silently re-sorts keys alphabetically.
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
chrono = { version = "0.4", features = ["clock"] }
Inflector = "0.11"
# Matches backend/Cargo.toml's pin -- policy-test evaluates the same
# generated Rego files the runtime does, so the engine version must agree.
regorus = "0.2"
# boundary-check's forbidden-import/standard-handler-override checks parse
# and walk real backend Rust source with syn's visitor API.
syn = { version = "2", features = ["full", "visit"] }
# validate's UUID/date/time seed-value shape checks -- matches backend/Cargo.toml's pin.
uuid = "1"

[dev-dependencies]
